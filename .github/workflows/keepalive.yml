name: PixelDrain keep-alive

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC mỗi thứ Hai (PixelDrain xóa sau ~120 ngày không ai xem)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch every link in file.txt
        run: |
          # Tải 1 KB đầu file qua API là đủ để PixelDrain tính 1 view + 1 download (đã kiểm chứng),
          # không cần tải trọn file nhiều GB.
          fail=0
          while read -r url; do
            id=${url##*/}
            code=$(curl -s -r 0-1023 -o /dev/null -w '%{http_code}' "https://pixeldrain.com/api/file/$id")
            if [ "$code" = 206 ] || [ "$code" = 200 ]; then st=done; else st="FAILED($code)"; fail=1; echo "::error::$url -> HTTP $code"; fi
            echo "$(date -u +%FT%TZ) $st $url" >> log.txt
          done < <(grep -vE '^\s*(#|$)' file.txt)
          echo "fail=$fail" >> "$GITHUB_ENV"

      - name: Commit log.txt (giữ repo active, tránh cron bị tắt sau 60 ngày)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add log.txt
          git commit -m "keep-alive $(date -u +%F)"
          git push

      - run: exit "$fail"
