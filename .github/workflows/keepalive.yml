name: PixelDrain keep-alive

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC mỗi thứ Hai (PixelDrain xóa sau 60 ngày không ai tải)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch every link in file.txt
        timeout-minutes: 300
        run: |
          # PixelDrain chỉ reset hạn xóa khi tải HƠN 10% file trong MỘT request
          # (và tối đa 1 lần / 24h). Vì vậy tải 12% đầu mỗi file bằng một range request.
          # Mở trang /u/<id> trước để có thêm 1 view: downloads > 3x views sẽ bị bật captcha.
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          fail=0
          while read -r url; do
            id=${url##*/}
            info=$(curl -s --retry 3 "https://pixeldrain.com/api/file/$id/info")
            size=$(jq -r '.size // 0' <<<"$info")
            avail=$(jq -r '.availability // ""' <<<"$info")
            if [ "$size" -le 0 ]; then
              st="FAILED(info: $(jq -r '.value // "unknown"' <<<"$info"))"
            else
              curl -s -A "$ua" -o /dev/null "https://pixeldrain.com/u/$id"
              need=$(( size * 12 / 100 + 1 ))
              [ "$need" -gt "$size" ] && need=$size
              read -r code got < <(curl -s -A "$ua" -e "https://pixeldrain.com/u/$id" \
                -r "0-$(( need - 1 ))" -o /dev/null -w '%{http_code} %{size_download}\n' \
                "https://pixeldrain.com/api/file/$id")
              if { [ "$code" = 206 ] || [ "$code" = 200 ]; } && [ "$got" -ge "$need" ]; then
                st="done($(( got / 1048576 ))MB/$(( size / 1048576 ))MB last_view=$(jq -r .date_last_view <<<"$info"))"
              else
                st="FAILED(http=$code got=$got need=$need $avail)"
              fi
            fi
            case $st in FAILED*) fail=1; echo "::error::$url -> $st";; esac
            echo "$(date -u +%FT%TZ) $st $url" | tee -a log.txt
          done < <(grep -vE '^\s*(#|$)' file.txt)
          echo "fail=$fail" >> "$GITHUB_ENV"

      - name: Commit log.txt (giữ repo active, tránh cron bị tắt sau 60 ngày)
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add log.txt
          git commit -m "keep-alive $(date -u +%F)"
          git push

      - if: always()
        run: exit "${fail:-1}"
