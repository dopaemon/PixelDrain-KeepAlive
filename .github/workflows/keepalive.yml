name: PixelDrain keep-alive

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC mỗi thứ Hai (PixelDrain xóa sau 60 ngày không ai tải)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch every link in file.txt via Cloudflare Worker
        timeout-minutes: 300
        run: |
          # Cấu hình domain Cloudflare Worker của bạn
          WORKER_URL="https://pixeldrain.cloudpanic.org"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          fail=0

          while read -r url; do
            # Cắt bỏ khoảng trắng thừa (hoặc ký tự \r nếu file.txt tạo trên Windows) và lấy ID
            url=$(echo "$url" | tr -d '\r' | xargs)
            id=${url##*/}

            # 1. Lấy thông tin dung lượng file
            # (Nếu dùng bản Worker All-in-One có hỗ trợ ?json thì đổi thành: "$WORKER_URL/$id?json")
            info=$(curl -s --retry 3 -A "$ua" "https://pixeldrain.com/api/file/$id/info")
            size=$(jq -r '.size // 0' <<<"$info")
            avail=$(jq -r '.availability // ""' <<<"$info")

            if [ "$size" -le 0 ]; then
              st="FAILED(info: $(jq -r '.value // .message // "unknown"' <<<"$info"))"
            else
              # Mở trang /u/<id> để tăng 1 view (tránh việc downloads > 3x views bị dính captcha)
              curl -s -A "$ua" -o /dev/null "https://pixeldrain.com/u/$id"

              # Tính toán 12% dung lượng đầu file cần tải (để vượt ngưỡng >10% reset hạn xóa của PixelDrain)
              need=$(( size * 12 / 100 + 1 ))
              [ "$need" -gt "$size" ] && need=$size

              # 2. Tải 12% đầu của file thông qua đường dẫn /download/<id> của Cloudflare Worker
              read -r code got < <(curl -s -L --retry 2 -A "$ua" \
                -r "0-$(( need - 1 ))" -o /dev/null -w '%{http_code} %{size_download}\n' \
                "$WORKER_URL/download/$id")

              if { [ "$code" = 206 ] || [ "$code" = 200 ]; } && [ "$got" -ge "$need" ]; then
                st="done($(( got / 1048576 ))MB/$(( size / 1048576 ))MB last_view=$(jq -r '.date_last_view // "N/A"' <<<"$info"))"
              else
                st="FAILED(http=$code got=$got need=$need $avail)"
              fi
            fi

            case $st in FAILED*) fail=1; echo "::error::$url -> $st";; esac
            echo "$(date -u +%FT%TZ) $st $url" | tee -a log.txt
          done < <(grep -vE '^\s*(#|$)' file.txt)

          echo "fail=$fail" >> "$GITHUB_ENV"

      - name: Commit log.txt (giữ repo active, tránh cron bị tắt sau 60 ngày)
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add log.txt
          git diff --staged --quiet || (git commit -m "keep-alive $(date -u +%F)" && git push)

      - if: always()
        run: exit "${fail:-1}"
