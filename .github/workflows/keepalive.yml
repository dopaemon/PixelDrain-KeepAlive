name: PixelDrain keep-alive

on:
  schedule:
    - cron: "0 3 * * 1"   # 03:00 UTC mỗi thứ Hai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch every link in file.txt
        timeout-minutes: 300
        run: |
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          fail=0

          while read -r url; do
            url=$(echo "$url" | tr -d '\r' | xargs)
            id=${url##*/}

            info=$(curl -s --retry 3 -A "$ua" "https://pixeldrain.com/api/file/$id/info")
            size=$(jq -r '.size // 0' <<<"$info")
            avail=$(jq -r '.availability // ""' <<<"$info")

            if [ "$size" -le 0 ]; then
              st="FAILED(info: $(jq -r '.value // "unknown"' <<<"$info"))"
            else
              # 1. Giả lập mở trang web xem file (lấy cookie + tăng view để không bị bật captcha)
              curl -s -L -c cookies.txt -A "$ua" -o /dev/null "https://pixeldrain.com/u/$id"
              sleep 1

              need=$(( size * 12 / 100 + 1 ))
              [ "$need" -gt "$size" ] && need=$size

              # 2. Tải 12% đầu của file (kèm cookie và Referer chuẩn)
              read -r code got < <(curl -s -L -b cookies.txt -A "$ua" \
                -e "https://pixeldrain.com/u/$id" \
                -r "0-$(( need - 1 ))" -o /dev/null -w '%{http_code} %{size_download}\n' \
                "https://pixeldrain.com/api/file/$id?download")

              if { [ "$code" = 206 ] || [ "$code" = 200 ]; } && [ "$got" -ge "$need" ]; then
                st="done($(( got / 1048576 ))MB/$(( size / 1048576 ))MB last_view=$(jq -r .date_last_view <<<"$info"))"
              else
                st="FAILED(http=$code got=$got need=$need $avail)"
              fi
              rm -f cookies.txt
            fi

            case $st in FAILED*) fail=1; echo "::error::$url -> $st";; esac
            echo "$(date -u +%FT%TZ) $st $url" | tee -a log.txt

            # Nghỉ 3 giây giữa mỗi file để PixelDrain không khóa IP của GitHub Actions
            sleep 3
          done < <(grep -vE '^\s*(#|$)' file.txt)

          echo "fail=$fail" >> "$GITHUB_ENV"

      - name: Commit log.txt
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add log.txt
          git diff --staged --quiet || (git commit -m "keep-alive $(date -u +%F)" && git push)

      - if: always()
        run: exit "${fail:-1}"
